```html
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameZoneX — Administração</title>
<style>
body{margin:0;background:#070b14;color:#eef5ff;font:16px system-ui,sans-serif;padding:20px}
main{max-width:420px;margin:40px auto;background:#101827;padding:24px;border:1px solid #22324b;border-radius:16px}
h1 span{color:#37c5ff}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #34445c}
input{background:#070b14;color:white}
button{background:#168bd0;color:white;font-weight:bold;cursor:pointer}
#status{overflow-wrap:anywhere;color:#a6dfff}
</style>
</head>
<body>
<main>
<h1>GameZone<span>X</span></h1>
<h2>Login administrativo</h2>
<p>Entre com sua conta autorizada.</p>

<input id="email" type="email" placeholder="Seu e-mail">
<input id="senha" type="password" placeholder="Sua senha">
<button id="entrar">Entrar com e-mail</button>
<button id="google">Entrar com Google</button>
<button id="sair" hidden>Sair</button>
<p id="status">Aguardando login...</p>
<a href="./">Voltar à loja</a>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
 getAuth, signInWithEmailAndPassword, signInWithPopup,
 GoogleAuthProvider, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyAFrWQMTNgF-qDkRDIB_5sfNZVxo0wWpuc",
 authDomain: "gamezonex.firebaseapp.com",
 projectId: "gamezonex",
 storageBucket: "gamezonex.firebasestorage.app",
 messagingSenderId: "1063609787649",
 appId: "1:1063609787649:web:579e1c0506280f3b24a700"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const status = document.getElementById("status");

document.getElementById("entrar").onclick = async () => {
 try {
  await signInWithEmailAndPassword(
   auth,
   document.getElementById("email").value.trim(),
   document.getElementById("senha").value
  );
 } catch(e) {
  status.textContent = "Erro no login: " + e.message;
 }
};

document.getElementById("google").onclick = async () => {
 try {
  await signInWithPopup(auth, new GoogleAuthProvider());
 } catch(e) {
  status.textContent = "Erro no Google: " + e.message;
 }
};

document.getElementById("sair").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
 document.getElementById("sair").hidden = !user;
 status.textContent = user
  ? "Login realizado: " + user.email + ". A permissão de administrador ainda precisa ser configurada."
  : "Entre com sua conta.";
});
</script>
</body>
</html>
