
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameZoneX — Loja de Jogos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b14;color:#eef5ff;font:16px system-ui,sans-serif}
header{padding:22px 16px;text-align:center;background:#101827;border-bottom:1px solid #22324b}
h1{margin:0;font-size:30px}
h1 span{color:#37c5ff}
header p{color:#a6b7d0;margin:6px 0 0}
main{max-width:1000px;margin:auto;padding:20px}
input{width:100%;padding:14px;border:1px solid #34445c;border-radius:10px;background:#101827;color:white;font-size:16px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#101827;border:1px solid #22324b;border-radius:14px;overflow:hidden}
.cover{height:180px;background:#17243a;display:flex;align-items:center;justify-content:center;color:#a6b7d0;text-align:center;padding:12px}
.cover img{width:100%;height:100%;object-fit:cover}
.info{padding:15px}
.info h2{font-size:18px;margin:0 0 12px}
.price{font-size:22px;font-weight:bold;color:#37c5ff}
.old{color:#9aa8bb;text-decoration:line-through;font-size:14px}
.promo{color:#60e6a4;font-size:13px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#168bd0;color:white;font-weight:bold;font-size:16px;cursor:pointer;margin-top:12px}
button:hover{background:#0875b5}
#empty{text-align:center;color:#a6b7d0;padding:30px}
footer{text-align:center;padding:24px;color:#8293ac}
</style>
</head>
<body>
<header>
<h1>GameZone<span>X</span></h1>
<p>Encontre seu próximo jogo favorito</p>
</header>
<main>
<input id="search" type="search" placeholder="🔎 Pesquisar jogo..." aria-label="Pesquisar jogos">
<div class="grid" id="games"></div>
<p id="empty" hidden>Nenhum jogo encontrado.</p>
</main>
<footer>GameZoneX © Loja de jogos</footer>
<script>
const WHATSAPP="5511954242880";

const products=[
 {name:"Forza Horizon 6",price:9.90},
 {name:"Mortal Shell",price:4.90},
 {name:"Marvel's Spider-Man Remastered",price:9.90},
 {name:"Spider-Man 2",price:9.90},
 {name:"Miles Morales",price:7.90},
 {name:"LEGO Marvel Super Heroes 2",price:9.90},
 {name:"Ghostwire: Tokyo",price:4.90},
 {name:"Forza Horizon 4",price:4.90},
 {name:"Devil May Cry 5",price:12.90},
 {name:"Resident Evil Requiem",price:16.90},
 {name:"Pacote FPS AAA",price:14.90}
];

const money=n=>Number(n).toLocaleString("pt-BR",{
 style:"currency",currency:"BRL"
});

function render(){
 const q=document.getElementById("search").value
  .trim().toLowerCase();
 const list=products.filter(p=>p.name.toLowerCase().includes(q));
 const games=document.getElementById("games");
 games.innerHTML="";
 document.getElementById("empty").hidden=list.length>0;

 list.forEach(p=>{
  const card=document.createElement("article");
  card.className="card";

  const cover=document.createElement("div");
  cover.className="cover";
  cover.textContent=p.name;

  const info=document.createElement("div");
  info.className="info";

  const title=document.createElement("h2");
  title.textContent=p.name;

  const price=document.createElement("div");
  price.className="price";
  price.textContent=money(p.price);

  const buy=document.createElement("button");
  buy.textContent="Comprar pelo WhatsApp";
  buy.onclick=()=>{
   const msg=
    `Olá! Quero comprar o jogo ${p.name} na GameZoneX.\n`+
    `Valor anunciado: ${money(p.price)}.\n`+
    `Pode confirmar a disponibilidade e o pagamento?`;
   window.open(
    `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,
    "_blank"
   );
  };

  info.append(title,price,buy);
  card.append(cover,info);
  games.append(card);
 });
}
document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
